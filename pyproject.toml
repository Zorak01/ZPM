[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "zpm-mesh"
version = "0.1.0"
description = "Exact mesh-core codec and Blender import/export extension"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]

[project.optional-dependencies]
dev = ["ruff==0.14.3", "build>=1.2"]

[tool.setuptools.packages.find]
where = ["blender"]
include = ["zpm*"]

[tool.setuptools.package-data]
zpm = ["blender_manifest.toml", "LICENSE"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"blender/zpm/operators.py" = ["F722"]
